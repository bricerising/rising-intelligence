apiVersion: 1

datasources:
  - name: Prometheus
    uid: PROMETHEUS
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true

  - name: Loki
    uid: LOKI
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: TEMPO
          matcherRegex: '"traceId"\\s*:\\s*"([0-9a-fA-F]{32})"'
          name: TraceID
          url: "$${__value.raw}"

  - name: Tempo
    uid: TEMPO
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: PROMETHEUS
      lokiSearch:
        datasourceUid: LOKI

  - name: Postgres
    uid: POSTGRES
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    database: ${POSTGRES_DB}
    jsonData:
      sslmode: "disable"
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
