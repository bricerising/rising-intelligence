# Rising Intelligence - RSS Feeds Configuration
# =============================================
# Curated list of high-signal, low-noise sources for tech/AI/cloud intelligence.
#
# Structure:
# - Each source has: url, poll_interval, category, priority, and optional filters
# - poll_interval: seconds between polls (respect rate limits)
# - priority: 1-100 (higher = more important, affects trend scoring)
# - enabled: toggle sources on/off without removing config
#
# Categories:
# - official_blog: Vendor announcements (highest signal)
# - ai_research: AI/ML research and announcements
# - aggregator: Curated news aggregators
# - community: Developer communities (HN, Reddit, Lobsters)
# - opensource: GitHub trending and releases

defaults:
  poll_interval_seconds: 900  # 15 minutes default
  priority: 50
  enabled: true

# =============================================================================
# Official Tech & Cloud Blogs (Highest Signal)
# =============================================================================
official_blogs:

  # AWS - Primary source for AWS news
  - name: AWS News Blog
    url: http://feeds.feedburner.com/AmazonWebServicesBlog
    poll_interval_seconds: 3600  # Hourly (more frequent during re:Invent)
    priority: 95
    category: official_blog
    topics: ["aws.general"]
    notes: "Official Amazon Web Services news blog - major announcements"

  - name: AWS What's New
    url: https://aws.amazon.com/new/feed/
    poll_interval_seconds: 1800  # 30 minutes (high volume, many daily updates)
    priority: 90
    category: official_blog
    topics: ["aws.general"]
    notes: "Comprehensive feed of all AWS announcements - can be noisy but complete"

  # Google Cloud
  - name: Google Cloud Blog
    url: https://blog.google/products/google-cloud/rss/
    poll_interval_seconds: 3600  # Hourly
    priority: 90
    category: official_blog
    topics: ["cloud.gcp"]
    notes: "Official Google Cloud Platform news and announcements"

  # Microsoft Azure
  - name: Microsoft Azure Blog
    url: https://azure.microsoft.com/en-us/blog/feed/
    poll_interval_seconds: 3600  # Hourly
    priority: 90
    category: official_blog
    topics: ["cloud.azure"]
    notes: "Official Microsoft Azure blog - service announcements"

  # GitHub
  - name: GitHub Blog
    url: https://github.blog/feed/
    poll_interval_seconds: 7200  # Every 2 hours (few posts per week)
    priority: 85
    category: official_blog
    topics: ["dev.github"]
    notes: "Official GitHub updates, features, and engineering posts"

  # Cloudflare
  - name: Cloudflare Blog
    url: https://blog.cloudflare.com/feed/
    poll_interval_seconds: 7200  # Every 2 hours
    priority: 80
    category: official_blog
    topics: ["cloud.cloudflare"]
    notes: "Engineering blog - security, performance, networking deep-dives"

# =============================================================================
# AI & Research Focused Blogs
# =============================================================================
ai_research:

  # Google AI/Research
  - name: Google Research Blog
    url: https://research.googleblog.com/atom.xml
    poll_interval_seconds: 14400  # Every 4 hours (few posts per week)
    priority: 90
    category: ai_research
    topics: ["ai.google"]
    notes: "Official Google AI research - new models, papers, breakthroughs"

  # OpenAI
  - name: OpenAI News
    url: https://openai.com/news/rss.xml
    poll_interval_seconds: 1800  # Every 30 minutes (infrequent but high-impact posts)
    priority: 95
    category: ai_research
    topics: ["ai.openai"]
    notes: "Official OpenAI updates - GPT releases, API changes, research"

  # Anthropic (if they have a feed - check periodically)
  # Note: Anthropic doesn't have an official RSS as of this config
  # Monitor https://www.anthropic.com/news manually or via scraping

  # Meta AI - No official RSS, requires scraping or RSSHub
  # - name: Meta AI Blog
  #   url: TBD (use RSSHub or scraper)
  #   poll_interval_seconds: 14400
  #   priority: 85
  #   category: ai_research
  #   topics: ["ai.meta"]
  #   notes: "Meta AI research - LLaMA releases, open-source models"

# =============================================================================
# Aggregated Tech News (Curated, High-Signal)
# =============================================================================
aggregators:

  # Techmeme - Best for breaking tech news
  - name: Techmeme
    url: https://www.techmeme.com/feed.xml
    poll_interval_seconds: 1800  # Every 30 minutes (real-time aggregator)
    priority: 85
    category: aggregator
    topics: []  # Topics extracted from content
    notes: "Tech news aggregator - surfaces breaking stories from across the web"

  # InfoQ - Developer-focused news
  - name: InfoQ
    url: https://feed.infoq.com/
    poll_interval_seconds: 7200  # Every 2 hours
    priority: 75
    category: aggregator
    topics: []
    notes: "Software development news - architecture, cloud, DevOps, AI"

  # InfoQ - Cloud Computing specific
  - name: InfoQ Cloud
    url: https://feed.infoq.com/cloud-computing/
    poll_interval_seconds: 14400  # Every 4 hours
    priority: 70
    category: aggregator
    topics: ["cloud.general"]
    notes: "InfoQ cloud-specific feed"

  # InfoQ - AI/ML specific
  - name: InfoQ AI/ML
    url: https://feed.infoq.com/ai-ml-data-eng/
    poll_interval_seconds: 14400  # Every 4 hours
    priority: 75
    category: aggregator
    topics: ["ai.general"]
    notes: "InfoQ AI/ML-specific feed"

  # TechCrunch (optional - can be noisy)
  - name: TechCrunch
    url: http://feeds.feedburner.com/TechCrunch/
    poll_interval_seconds: 3600  # Hourly
    priority: 60
    category: aggregator
    enabled: false  # Disabled by default - enable if you want broader coverage
    topics: []
    notes: "Tech industry news - startups, funding, product launches"

  # Ars Technica (optional)
  - name: Ars Technica
    url: https://arstechnica.com/feed/
    poll_interval_seconds: 7200  # Every 2 hours
    priority: 55
    category: aggregator
    enabled: false  # Disabled by default
    topics: []
    notes: "In-depth tech coverage - security, policy, science"

# =============================================================================
# Developer Community & Social Feeds
# =============================================================================
# Note: HN and Reddit are handled by dedicated adapters, not RSS
# These are reference configurations for those adapters

community:

  # Hacker News - Handled by HN adapter
  hackernews:
    mode: top  # or 'new', 'best'
    poll_interval_seconds: 300  # Every 5 minutes
    priority: 80
    min_score: 10  # Filter low-score posts
    notes: "Y Combinator's Hacker News - developer community pulse"

  # Lobsters - Smaller, higher-signal alternative to HN
  lobsters:
    url: https://lobste.rs/rss
    poll_interval_seconds: 1800  # Every 30 minutes
    priority: 75
    enabled: true
    notes: "Computing-focused community - programming, CS, engineering"

  # Reddit - Handled by Reddit adapter
  reddit:
    subreddits:
      - name: programming
        poll_interval_seconds: 1800
        priority: 70
        min_score: 50
        notes: "Programming news and discussions"

      - name: MachineLearning
        poll_interval_seconds: 3600
        priority: 80
        min_score: 30
        filter_flairs: ["[R]", "[N]", "[P]"]  # Research, News, Project
        notes: "AI/ML research and discussions - academic focus"

      - name: technology
        poll_interval_seconds: 3600
        priority: 60
        min_score: 100
        notes: "General tech news - broader scope, filter for signal"

      - name: aws
        poll_interval_seconds: 3600
        priority: 75
        min_score: 10
        notes: "AWS-specific discussions and news"

      - name: devops
        poll_interval_seconds: 7200
        priority: 65
        min_score: 20
        notes: "DevOps practices and tools"

      - name: kubernetes
        poll_interval_seconds: 7200
        priority: 70
        min_score: 15
        notes: "Kubernetes news and discussions"

      - name: rust
        poll_interval_seconds: 7200
        priority: 65
        min_score: 20
        notes: "Rust programming language community"

      - name: golang
        poll_interval_seconds: 7200
        priority: 60
        min_score: 20
        notes: "Go programming language community"

# =============================================================================
# Open Source & Developer Project Feeds
# =============================================================================
opensource:

  # GitHub Trending - Third-party RSS feed
  - name: GitHub Trending (All Languages)
    url: https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml
    poll_interval_seconds: 86400  # Daily (feed updates once per day)
    priority: 70
    category: opensource
    topics: ["dev.github"]
    notes: "Unofficial RSS for GitHub trending repos - daily update"

  # GitHub Trending - Language-specific (optional)
  - name: GitHub Trending (Python)
    url: https://mshibanami.github.io/GitHubTrendingRSS/daily/python.xml
    poll_interval_seconds: 86400
    priority: 60
    category: opensource
    enabled: false
    topics: ["lang.python"]

  - name: GitHub Trending (TypeScript)
    url: https://mshibanami.github.io/GitHubTrendingRSS/daily/typescript.xml
    poll_interval_seconds: 86400
    priority: 60
    category: opensource
    enabled: false
    topics: ["lang.typescript"]

  - name: GitHub Trending (Rust)
    url: https://mshibanami.github.io/GitHubTrendingRSS/daily/rust.xml
    poll_interval_seconds: 86400
    priority: 65
    category: opensource
    enabled: false
    topics: ["lang.rust"]

  # GitHub Releases - Key projects to track
  # Format: https://github.com/{owner}/{repo}/releases.atom
  github_releases:
    poll_interval_seconds: 86400  # Daily
    priority: 70
    repos:
      # Cloud & Infrastructure
      - owner: kubernetes
        repo: kubernetes
        topics: ["cloud.kubernetes"]

      - owner: hashicorp
        repo: terraform
        topics: ["cloud.terraform"]

      - owner: docker
        repo: compose
        topics: ["cloud.docker"]

      # Languages & Runtimes
      - owner: nodejs
        repo: node
        topics: ["framework.node"]

      - owner: python
        repo: cpython
        topics: ["lang.python"]

      - owner: rust-lang
        repo: rust
        topics: ["lang.rust"]

      # AI & ML
      - owner: openai
        repo: openai-python
        topics: ["ai.openai"]

      - owner: langchain-ai
        repo: langchain
        topics: ["ai.agents", "ai.rag"]

      - owner: huggingface
        repo: transformers
        topics: ["ai.llm"]

      # Databases
      - owner: redis
        repo: redis
        topics: ["data.redis"]

      - owner: apache
        repo: kafka
        topics: ["data.kafka"]

      # Observability
      - owner: grafana
        repo: grafana
        topics: ["observability.grafana"]

      - owner: open-telemetry
        repo: opentelemetry-js
        topics: ["observability.opentelemetry"]

# =============================================================================
# Advanced: Custom HN Feeds via hnrss.org
# =============================================================================
# These provide filtered HN feeds for specific topics
# Use sparingly to avoid over-polling

hnrss_custom:
  enabled: false  # Enable if you want topic-specific HN alerts
  base_url: https://hnrss.org
  feeds:
    - query: AWS
      poll_interval_seconds: 1800
      priority: 75

    - query: Anthropic OR Claude
      poll_interval_seconds: 1800
      priority: 80

    - query: OpenAI OR GPT
      poll_interval_seconds: 1800
      priority: 80

# =============================================================================
# Polling Strategy Notes
# =============================================================================
#
# Real-time (5-15 min): HN top stories, critical aggregators
# Near-real-time (30 min): Techmeme, OpenAI, AWS What's New
# Hourly: Official blogs, Reddit hot posts
# Every 2-4 hours: Research blogs, InfoQ, lower-priority sources
# Daily: GitHub trending, GitHub releases
#
# Total sources (default enabled): ~20 RSS feeds + HN + 8 subreddits
# Estimated daily API calls: ~2000-3000 (well within rate limits)
