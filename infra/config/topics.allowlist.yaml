# Topics Allowlist Configuration
# ==============================
# This file defines the canonical topics tracked by the Rising Intelligence system.
# Topics are matched against event title + text using keywords and regex patterns.
#
# Structure:
# - topics[]: List of topic definitions
#   - key: Canonical dotted key (e.g., "aws.bedrock")
#   - display_name: Human-friendly name for dashboards
#   - priority: Integer 1-100 (higher = more important, used for deterministic selection)
#   - aliases: Alternative names (for UX and optional matching)
#   - matchers: Rules for detecting this topic
#     - type: "keyword" (case-insensitive substring) or "regex" (RE2-compatible)
#     - value/pattern: The match value
#
# - suppression: Topics to exclude from trending/alerts
# - defaults: Global settings
#
# IMPORTANT: When an event matches more than max_topics_per_event topics,
# the topics with highest priority are kept. Topics with equal priority
# are sorted alphabetically by key for determinism.
#
# PRECISION IMPROVEMENTS (2026-02-10):
# - Generic topics (aws.general, ai.general, cloud.general) now require substantive context
# - Short acronyms (RAG, EKS) require surrounding context to avoid false positives
# - Removed over-broad keywords ("serverless", "container") that matched tangentially
# - Lowered priority of fallback topics (general/broad topics) to 10-20 range
# - Added specific services (aws.ecs, aws.fargate) to capture granular signals

defaults:
  # Maximum topics to extract per event (prevents over-tagging)
  max_topics_per_event: 5
  # Default regex flags (case-insensitive by default)
  regex_case_insensitive: true
  # Default priority for topics without explicit priority
  default_priority: 50

  # Priority Ranges (for reference):
  # 90-100: Highest - specific AI services, critical infra (Bedrock, Agents)
  # 75-85: High - specific cloud services, major platforms (EC2, ECS, SageMaker)
  # 60-70: Medium - supporting tools, frameworks (Kubernetes, Terraform)
  # 40-55: Low-Medium - languages, databases, general dev tools
  # 20-30: Low - broad services that often co-occur (aws.general)
  # 10-15: Lowest - catch-all categories (ai.general, cloud.general)

topics:
  # ===========================================================================
  # AWS Core Services (Priority 80-90: High importance, specific)
  # ===========================================================================
  - key: aws.general
    display_name: AWS (General)
    priority: 20  # Very low priority - only when no specific service matches
    aliases: ["Amazon Web Services"]
    matchers:
      # Only match full "Amazon Web Services" to avoid polluting specific service topics
      - type: keyword
        value: "Amazon Web Services"
      - type: keyword
        value: "CloudFront"
      # Or AWS in platform/strategy context (not service-specific)
      - type: regex
        pattern: "\\bAWS\\b.*(platform strategy|cloud strategy|aws summit|re:invent|aws overview)"

  - key: aws.bedrock
    display_name: AWS Bedrock
    priority: 90  # High priority - specific AI service
    aliases: ["Bedrock", "Amazon Bedrock"]
    matchers:
      - type: keyword
        value: "Bedrock"
      - type: regex
        pattern: "\\bBedrock\\b"

  - key: aws.lambda
    display_name: AWS Lambda
    priority: 80
    aliases: ["Lambda"]
    matchers:
      - type: regex
        pattern: "\\b(AWS\\s+)?Lambda\\b"
      # Removed generic "serverless" - too broad without context

  - key: aws.ec2
    display_name: AWS EC2
    priority: 75
    aliases: ["EC2", "Elastic Compute"]
    matchers:
      - type: keyword
        value: "EC2"
      - type: regex
        pattern: "\\bEC2\\b"

  - key: aws.s3
