suppression:
  # Topics to exclude from trending/alerts (still tracked, just muted)
  muted_topics: []
  # Example: Mute general AI if it's too noisy
  # muted_topics:
  #   - ai.general

# ===========================================================================
# Topic Weight Overrides (Dynamic Adjustment)
# ===========================================================================
# Adjust topic importance without editing matchers. Useful for:
# - Boosting topics you care about this week
# - Suppressing noisy topics temporarily
# - Adjusting for conferences/events
#
# Weights multiply the final score: 1.0 = normal, 2.0 = double, 0.5 = half
# Set to 0.0 to effectively mute (or add to muted_topics above)
#
# These can be overridden at runtime via:
# - Redis: SET topic_weight:{key} {value}
# - CLI: riops topics set-weight aws.bedrock 2.0
# - ENV: TOPIC_WEIGHT_OVERRIDE=aws.bedrock:2.0,ai.openai:0.5

weights:
  # Default weight for all topics (if not specified)
  default: 1.0

  # Per-topic overrides (static, from config)
  overrides: {}
  # Example: Boost Bedrock, suppress general AI
  # overrides:
  #   aws.bedrock: 1.5
  #   ai.general: 0.3

# ===========================================================================
# Configuration Precedence (IMPORTANT)
# ===========================================================================
# Multiple configuration sources exist. Here's the resolution order (highest wins):
#
# TOPIC WEIGHTS:
#   1. Redis key: `topic_weight:{key}` (runtime, via riops CLI or API)
#   2. Environment: `TOPIC_WEIGHT_OVERRIDE=aws.bedrock:2.0,ai.openai:0.5`
#   3. This file: `weights.overrides` section (below)
#   4. Default: `weights.default` (1.0)
#
# TOPIC DEFINITIONS (matchers, aliases):
#   - This file is the ONLY source. No runtime override.
#   - To add/modify topics, edit this file and restart Collector.
#
# SUPPRESSION (muted_topics):
#   - This file is the ONLY source. No runtime override.
#   - To mute a topic, add to `suppression.muted_topics` and restart.
#
# EXAMPLES:
#   # Temporarily boost Bedrock (via CLI, persists in Redis):
#   riops topics set-weight aws.bedrock 2.0 --ttl 24h
#
#   # Boost via environment (set before starting service):
#   export TOPIC_WEIGHT_OVERRIDE="aws.bedrock:2.0,ai.openai:1.5"
#
#   # Permanent boost (edit this file):
#   weights:
#     overrides:
#       aws.bedrock: 1.5

runtime:
  # Enable Redis-based weight overrides
  redis_overrides_enabled: true
  # Key pattern for Redis lookups
  redis_key_pattern: "topic_weight:{key}"
  # TTL for Redis overrides (0 = no expiry, set via CLI --ttl flag)
  redis_override_ttl_seconds: 0
