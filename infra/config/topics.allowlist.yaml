# Topics Allowlist Configuration
# ==============================
# This file defines the canonical topics tracked by the Rising Intelligence system.
# Topics are matched against event title + text using keywords and regex patterns.
#
# Structure:
# - topics[]: List of topic definitions
#   - key: Canonical dotted key (e.g., "aws.bedrock")
#   - display_name: Human-friendly name for dashboards
#   - aliases: Alternative names (for UX and optional matching)
#   - matchers: Rules for detecting this topic
#     - type: "keyword" (case-insensitive substring) or "regex" (RE2-compatible)
#     - value/pattern: The match value
#
# - suppression: Topics to exclude from trending/alerts
# - defaults: Global settings

defaults:
  # Maximum topics to extract per event (prevents over-tagging)
  max_topics_per_event: 5
  # Default regex flags (case-insensitive by default)
  regex_case_insensitive: true

topics:
  # ===========================================================================
  # AWS Core Services
  # ===========================================================================
  - key: aws.general
    display_name: AWS (General)
    aliases: ["Amazon Web Services"]
    matchers:
      - type: keyword
        value: "AWS"
      - type: keyword
        value: "Amazon Web Services"

  - key: aws.bedrock
    display_name: AWS Bedrock
    aliases: ["Bedrock", "Amazon Bedrock"]
    matchers:
      - type: keyword
        value: "Bedrock"
      - type: regex
        pattern: "\\bBedrock\\b"

  - key: aws.lambda
    display_name: AWS Lambda
    aliases: ["Lambda"]
    matchers:
      - type: regex
        pattern: "\\b(AWS\\s+)?Lambda\\b"
      - type: keyword
        value: "serverless"

  - key: aws.ec2
    display_name: AWS EC2
    aliases: ["EC2", "Elastic Compute"]
    matchers:
      - type: keyword
        value: "EC2"
      - type: regex
        pattern: "\\bEC2\\b"

  - key: aws.s3
    display_name: AWS S3
    aliases: ["S3", "Simple Storage"]
    matchers:
      - type: keyword
        value: "S3"
      - type: regex
        pattern: "\\bS3\\b"

  - key: aws.eks
    display_name: AWS EKS
    aliases: ["EKS", "Elastic Kubernetes"]
    matchers:
      - type: keyword
        value: "EKS"
      - type: regex
        pattern: "\\bEKS\\b"

  - key: aws.sagemaker
    display_name: AWS SageMaker
    aliases: ["SageMaker"]
    matchers:
      - type: keyword
        value: "SageMaker"

  - key: aws.dynamodb
    display_name: AWS DynamoDB
    aliases: ["DynamoDB", "Dynamo"]
    matchers:
      - type: keyword
        value: "DynamoDB"

  # ===========================================================================
  # AI / ML General
  # ===========================================================================
  - key: ai.general
    display_name: AI / ML
    aliases: ["Artificial Intelligence", "Machine Learning", "ML"]
    matchers:
      - type: regex
        pattern: "\\b(AI|artificial intelligence|machine learning|ML)\\b"

  - key: ai.llm
    display_name: Large Language Models
    aliases: ["LLM", "Language Model"]
    matchers:
      - type: keyword
        value: "LLM"
      - type: keyword
        value: "large language model"
      - type: regex
        pattern: "\\bGPT-?\\d"

  - key: ai.genai
    display_name: Generative AI
    aliases: ["GenAI", "Generative"]
    matchers:
      - type: keyword
        value: "generative AI"
      - type: keyword
        value: "GenAI"

  - key: ai.agents
    display_name: AI Agents
    aliases: ["Agents", "Agentic"]
    matchers:
      - type: regex
        pattern: "\\b(AI\\s+)?agents?\\b"
      - type: keyword
        value: "agentic"

  - key: ai.rag
    display_name: RAG (Retrieval-Augmented Generation)
    aliases: ["RAG"]
    matchers:
      - type: keyword
        value: "RAG"
      - type: keyword
        value: "retrieval-augmented"
      - type: keyword
        value: "retrieval augmented"

  # ===========================================================================
  # AI Providers / Models
  # ===========================================================================
  - key: ai.openai
    display_name: OpenAI
    aliases: ["GPT", "ChatGPT"]
    matchers:
      - type: keyword
        value: "OpenAI"
      - type: keyword
        value: "ChatGPT"
      - type: regex
        pattern: "\\bGPT-?[34]"

  - key: ai.anthropic
    display_name: Anthropic
    aliases: ["Claude"]
    matchers:
      - type: keyword
        value: "Anthropic"
      - type: keyword
        value: "Claude"

  - key: ai.google
    display_name: Google AI
    aliases: ["Gemini", "Bard", "PaLM"]
    matchers:
      - type: keyword
        value: "Gemini"
      - type: keyword
        value: "Google AI"
      - type: regex
        pattern: "\\b(Bard|PaLM)\\b"

  - key: ai.meta
    display_name: Meta AI
    aliases: ["LLaMA", "Llama"]
    matchers:
      - type: regex
        pattern: "\\b(LLaMA|Llama\\s*\\d?)\\b"
      - type: keyword
        value: "Meta AI"

  - key: ai.mistral
    display_name: Mistral AI
    aliases: ["Mistral", "Mixtral"]
    matchers:
      - type: keyword
        value: "Mistral"
      - type: keyword
        value: "Mixtral"

  # ===========================================================================
  # Cloud / Infrastructure
  # ===========================================================================
  - key: cloud.kubernetes
    display_name: Kubernetes
    aliases: ["K8s", "Kube"]
    matchers:
      - type: keyword
        value: "Kubernetes"
      - type: keyword
        value: "K8s"

  - key: cloud.docker
    display_name: Docker
    aliases: ["Container"]
    matchers:
      - type: keyword
        value: "Docker"
      - type: keyword
        value: "container"

  - key: cloud.terraform
    display_name: Terraform
    aliases: ["IaC", "Infrastructure as Code"]
    matchers:
      - type: keyword
        value: "Terraform"
      - type: keyword
        value: "OpenTofu"

  # ===========================================================================
  # Programming Languages / Frameworks
  # ===========================================================================
  - key: lang.rust
    display_name: Rust
    aliases: []
    matchers:
      - type: regex
        pattern: "\\bRust\\b(?!\\s+(Belt|bucket))"

  - key: lang.go
    display_name: Go (Golang)
    aliases: ["Golang"]
    matchers:
      - type: keyword
        value: "Golang"
      - type: regex
        pattern: "\\bGo\\s+(language|programming|1\\.\\d+)"

  - key: lang.typescript
    display_name: TypeScript
    aliases: ["TS"]
    matchers:
      - type: keyword
        value: "TypeScript"

  - key: lang.python
    display_name: Python
    aliases: []
    matchers:
      - type: keyword
        value: "Python"

  - key: framework.react
    display_name: React
    aliases: ["React.js", "ReactJS"]
    matchers:
      - type: keyword
        value: "React"
      - type: keyword
        value: "Next.js"

  - key: framework.node
    display_name: Node.js
    aliases: ["Node", "NodeJS"]
    matchers:
      - type: keyword
        value: "Node.js"
      - type: keyword
        value: "NodeJS"

  # ===========================================================================
  # Data / Databases
  # ===========================================================================
  - key: data.postgres
    display_name: PostgreSQL
    aliases: ["Postgres", "PG"]
    matchers:
      - type: keyword
        value: "PostgreSQL"
      - type: keyword
        value: "Postgres"

  - key: data.kafka
    display_name: Apache Kafka
    aliases: ["Kafka"]
    matchers:
      - type: keyword
        value: "Kafka"
      - type: keyword
        value: "Redpanda"

  - key: data.redis
    display_name: Redis
    aliases: []
    matchers:
      - type: keyword
        value: "Redis"

  # ===========================================================================
  # Observability
  # ===========================================================================
  - key: observability.grafana
    display_name: Grafana
    aliases: ["Loki", "Mimir", "Tempo"]
    matchers:
      - type: keyword
        value: "Grafana"
      - type: keyword
        value: "Loki"
      - type: keyword
        value: "Prometheus"

  - key: observability.opentelemetry
    display_name: OpenTelemetry
    aliases: ["OTel"]
    matchers:
      - type: keyword
        value: "OpenTelemetry"
      - type: keyword
        value: "OTel"

  # ===========================================================================
  # Security
  # ===========================================================================
  - key: security.general
    display_name: Security
    aliases: ["Cybersecurity", "InfoSec"]
    matchers:
      - type: keyword
        value: "cybersecurity"
      - type: keyword
        value: "vulnerability"
      - type: keyword
        value: "CVE-"

suppression:
  # Topics to exclude from trending/alerts (still tracked, just muted)
  muted_topics: []
  # Example: Mute general AI if it's too noisy
  # muted_topics:
  #   - ai.general
