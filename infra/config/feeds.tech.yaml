# =============================================================================
# Developer Community & Social Feeds
# =============================================================================
# Note: HN and Reddit are handled by dedicated adapters, not RSS
# These are reference configurations for those adapters

community:

  # Hacker News - Handled by HN adapter
  hackernews:
    mode: top  # or 'new', 'best'
    poll_interval_seconds: 300  # Every 5 minutes
    priority: 80
    min_score: 10  # Filter low-score posts
    notes: "Y Combinator's Hacker News - developer community pulse"

  # Lobsters - Smaller, higher-signal alternative to HN
  lobsters:
    url: https://lobste.rs/rss
    poll_interval_seconds: 1800  # Every 30 minutes
    priority: 75
    enabled: true
    notes: "Computing-focused community - programming, CS, engineering"

  # Reddit - Handled by Reddit adapter
  reddit:
    subreddits:
      - name: programming
        poll_interval_seconds: 1800
        priority: 70
        min_score: 50
        notes: "Programming news and discussions"

      - name: MachineLearning
        poll_interval_seconds: 3600
        priority: 80
        min_score: 30
        filter_flairs: ["[R]", "[N]", "[P]"]  # Research, News, Project
        notes: "AI/ML research and discussions - academic focus"

      - name: technology
        poll_interval_seconds: 3600
        priority: 60
        min_score: 100
        notes: "General tech news - broader scope, filter for signal"

      - name: aws
        poll_interval_seconds: 3600
        priority: 75
        min_score: 10
        notes: "AWS-specific discussions and news"

      - name: devops
        poll_interval_seconds: 7200
        priority: 65
        min_score: 20
        notes: "DevOps practices and tools"

      - name: kubernetes
        poll_interval_seconds: 7200
        priority: 70
        min_score: 15
        notes: "Kubernetes news and discussions"

      - name: rust
        poll_interval_seconds: 7200
        priority: 65
        min_score: 20
        notes: "Rust programming language community"

      - name: golang
        poll_interval_seconds: 7200
        priority: 60
        min_score: 20
        notes: "Go programming language community"

