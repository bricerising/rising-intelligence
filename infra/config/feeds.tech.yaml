# GitHub Releases - Key projects to track
# Format: https://github.com/{owner}/{repo}/releases.atom
github_releases:
  poll_interval_seconds: 86400  # Daily
  priority: 70
  repos:
    # Cloud & Infrastructure
    - owner: kubernetes
      repo: kubernetes
      topics: ["cloud.kubernetes"]

    - owner: hashicorp
      repo: terraform
      topics: ["cloud.terraform"]

    - owner: docker
      repo: compose
      topics: ["cloud.docker"]

    # Languages & Runtimes
    - owner: nodejs
      repo: node
      topics: ["framework.node"]

    - owner: python
      repo: cpython
      topics: ["lang.python"]

    - owner: rust-lang
      repo: rust
      topics: ["lang.rust"]

    # AI & ML
    - owner: openai
      repo: openai-python
      topics: ["ai.openai"]

    - owner: langchain-ai
      repo: langchain
      topics: ["ai.agents", "ai.rag"]

    - owner: huggingface
      repo: transformers
      topics: ["ai.llm"]

    # Databases
    - owner: redis
      repo: redis
      topics: ["data.redis"]

    - owner: apache
      repo: kafka
      topics: ["data.kafka"]

    # Observability
    - owner: grafana
      repo: grafana
      topics: ["observability.grafana"]

    - owner: open-telemetry
      repo: opentelemetry-js
      topics: ["observability.opentelemetry"]

# =============================================================================
# Advanced: Custom HN Feeds via hnrss.org
# =============================================================================
# These provide filtered HN feeds for specific topics
# Use sparingly to avoid over-polling

hnrss_custom:
  enabled: false  # Enable if you want topic-specific HN alerts
  base_url: https://hnrss.org
  feeds:
    - query: AWS
      poll_interval_seconds: 1800
      priority: 75

    - query: Anthropic OR Claude
      poll_interval_seconds: 1800
      priority: 80

    - query: OpenAI OR GPT
      poll_interval_seconds: 1800
      priority: 80

# =============================================================================
# Polling Strategy Notes
# =============================================================================
#
# Real-time (5-15 min): Cloud status feeds, HN top stories, critical aggregators
# Near-real-time (30 min): OpenAI, AWS What's New, cloud release streams
# Hourly: Official blogs, selected product release-note feeds, Reddit hot posts
# Every 2-4 hours: Security bulletins, research blogs, InfoQ, lower-priority sources
# Daily: GitHub trending, GitHub releases
#
# Total sources (default enabled): ~67 RSS feeds + HN + 8 subreddits
# Estimated daily RSS polls (enabled feeds): ~1650 (well within rate limits)
