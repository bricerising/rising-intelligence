# Note: 'version' is deprecated in Docker Compose V2 and ignored.
# See: https://docs.docker.com/compose/compose-file/04-version-and-name/

services:
  # Kafka-compatible broker (single-node local dev).
  redpanda:
    image: redpandadata/redpanda:${REDPANDA_VERSION:-v24.3.5}
    command:
      [
        "redpanda",
        "start",
        "--overprovisioned",
        "--smp",
        "1",
        "--memory",
        "1G",
        "--reserve-memory",
        "0M",
        "--node-id",
        "0",
        "--check=false",
        "--kafka-addr",
        "internal://0.0.0.0:9092,external://0.0.0.0:19092",
        "--advertise-kafka-addr",
        "internal://redpanda:9092,external://localhost:9092",
        "--schema-registry-addr",
        "internal://0.0.0.0:8081,external://0.0.0.0:18081",
        "--pandaproxy-addr",
        "internal://0.0.0.0:8082,external://0.0.0.0:18082",
        "--advertise-pandaproxy-addr",
        "internal://redpanda:8082,external://localhost:8082"
      ]
    ports:
      - "127.0.0.1:9092:19092" # kafka external
      - "127.0.0.1:8081:18081" # schema registry external
      - "127.0.0.1:8082:18082" # pandaproxy external (optional)
      - "127.0.0.1:9644:9644" # admin
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel/collector-config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel/collector-config.yaml
    depends_on:
      - mimir
      - loki
      - tempo
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 10s
      timeout: 2s
      retries: 3

  mimir:
    image: grafana/mimir:2.11.0
    command: ["-config.file=/etc/mimir/mimir.yaml"]
    ports:
      - "127.0.0.1:9009:9009"
    volumes:
      - ./infra/mimir/mimir.yaml:/etc/mimir/mimir.yaml
      - mimir-data:/tmp/mimir
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9009/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.4
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.4
    profiles: ["promtail"]
    command: -config.file=/etc/promtail/config.yaml
    volumes:
      - ./infra/promtail/promtail.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tempo:
    image: grafana/tempo:2.3.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo-data:/tmp/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317" # otlp grpc
      - "127.0.0.1:4318:4318" # otlp http
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:10.3.1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_INSTALL_PLUGINS: hamedkarbasi93-kafka-datasource
      POSTGRES_USER: ${POSTGRES_USER:-rising}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rising}
      POSTGRES_DB: ${POSTGRES_DB:-rising_intelligence}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      - mimir
      - loki
      - postgres
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--dir",
        "/data",
        "--appendfilename",
        "rising-intelligence.aof",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru"
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rising}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rising}
      POSTGRES_DB: ${POSTGRES_DB:-rising_intelligence}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v2.6.1}
    profiles: ["console"]
    depends_on:
      - redpanda
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: "http://redpanda:8081"

  ops-cli:
    build:
      context: .
      dockerfile: ./packages/ops-cli/Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_URL: "http://redpanda:8081"
      SCHEMA_COMPATIBILITY: "BACKWARD"
      SCHEMA_REGISTRY_RETRIES: "20"
    command: ["schema-registry", "publish-protos"]
    restart: on-failure

  kafka-init:
    build:
      context: .
      dockerfile: ./packages/ops-cli/Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "redpanda:9092"
    command: ["kafka", "create-topics"]
    restart: on-failure

  # =============================================================================
  # Application Services
  # =============================================================================

  collector:
    build:
      context: .
      dockerfile: ./apps/collector/Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
      ops-cli:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      CHECKPOINT_PATH: "/data/checkpoints.db"
      TOPICS_ALLOWLIST_PATH: "/config/topics.allowlist.yaml"
      FEEDS_CONFIG_PATH: "/config/feeds.yaml"
      LOG_LEVEL: "info"
      # Article content fetching (improves tag extraction)
      FETCH_ARTICLE_CONTENT: "true"
      ARTICLE_FETCH_TIMEOUT_MS: "10000"
      ARTICLE_MAX_CONTENT_LENGTH: "50000"
      ARTICLE_MIN_CONTENT_LENGTH: "200"
      ARTICLE_DOMAIN_DELAY_MS: "1000"
      # Source toggles
      RSS_ENABLED: "true"
      HN_ENABLED: "true"
      LOBSTERS_ENABLED: "true"
      REDDIT_ENABLED: "false"
      BLUESKY_ENABLED: "false"
      MASTODON_ENABLED: "false"
      GITHUB_ENABLED: "false"
    volumes:
      - collector-checkpoints:/data
      - ./infra/config/topics.allowlist.yaml:/config/topics.allowlist.yaml:ro
      - ./infra/config/feeds.yaml:/config/feeds.yaml:ro
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  persister:
    build:
      context: .
      dockerfile: ./apps/persister/Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
      ops-cli:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_CLIENT_ID: "persister"
      KAFKA_CONSUMER_GROUP: "persister"
      KAFKA_TOPIC_RAW_EVENTS: "events.raw"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rising}:${POSTGRES_PASSWORD:-rising}@postgres:5432/${POSTGRES_DB:-rising_intelligence}"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "info"
    ports:
      - "127.0.0.1:3003:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  trends:
    build:
      context: .
      dockerfile: ./apps/trends/Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
      ops-cli:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_CLIENT_ID: "trends"
      KAFKA_CONSUMER_GROUP: "trends-processor"
      KAFKA_TOPIC_RAW_EVENTS: "events.raw"
      KAFKA_TOPIC_TRENDS_SNAPSHOTS: "trends.snapshots"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rising}:${POSTGRES_PASSWORD:-rising}@postgres:5432/${POSTGRES_DB:-rising_intelligence}"
      REDIS_URL: "redis://redis:6379"
      TOPICS_ALLOWLIST_PATH: "/config/topics.allowlist.yaml"
      LOG_LEVEL: "info"
      TREND_WINDOWS: "15m,60m"
      SNAPSHOT_INTERVAL_SECONDS: "300"
      TOP_N_TOPICS: "10"
      MAX_EVIDENCE_PER_TOPIC: "10"
    volumes:
      - ./infra/config/topics.allowlist.yaml:/config/topics.allowlist.yaml:ro
    ports:
      - "127.0.0.1:3004:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  brief:
    build:
      context: .
      dockerfile: ./apps/brief/Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
      ops-cli:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_CLIENT_ID: "brief"
      KAFKA_CONSUMER_GROUP: "brief-generator"
      KAFKA_TOPIC_SUMMARY_REQUESTS: "summary.requests"
      KAFKA_TOPIC_SUMMARY_RESULTS: "summary.results"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-rising}:${POSTGRES_PASSWORD:-rising}@postgres:5432/${POSTGRES_DB:-rising_intelligence}"
      REDIS_URL: "redis://redis:6379"
      LOG_LEVEL: "info"
      LLM_PROVIDER: "${BRIEF_LLM_PROVIDER:-codex-cli}"
      LLM_CODEX_CLI_COMMAND: "${BRIEF_LLM_CODEX_COMMAND:-codex}"
      LLM_CODEX_MODEL: "${BRIEF_LLM_CODEX_MODEL:-}"
      LLM_CODEX_PROFILE: "${BRIEF_LLM_CODEX_PROFILE:-}"
      LLM_CODEX_TIMEOUT_MS: "${BRIEF_LLM_CODEX_TIMEOUT_MS:-120000}"
      CODEX_HOME: "/home/brief/.codex"
      HOME: "/home/brief"
    volumes:
      - ${HOME}/.codex:/home/brief/.codex
    ports:
      - "127.0.0.1:3005:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  redpanda-data:
  grafana-data:
  loki-data:
  mimir-data:
  tempo-data:
  redis-data:
  postgres-data:
  collector-checkpoints:
