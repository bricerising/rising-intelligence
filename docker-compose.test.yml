# Test infrastructure for integration and e2e tests.
# Run: docker compose -f docker-compose.test.yml up -d

services:
  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rising_intelligence_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d rising_intelligence_test"]
      interval: 5s
      timeout: 2s
      retries: 5
    # No persistent volume - tests start fresh

  # Redpanda for e2e tests only (heavier, slower startup)
  redpanda-test:
    profiles: ["e2e"]
    image: redpandadata/redpanda:${REDPANDA_VERSION:-v24.3.5}
    command:
      [
        "redpanda",
        "start",
        "--overprovisioned",
        "--smp",
        "1",
        "--memory",
        "512M",
        "--reserve-memory",
        "0M",
        "--node-id",
        "0",
        "--check=false",
        "--kafka-addr",
        "internal://0.0.0.0:9092,external://0.0.0.0:19092",
        "--advertise-kafka-addr",
        "internal://redpanda-test:9092,external://localhost:9093",
        "--schema-registry-addr",
        "internal://0.0.0.0:8081,external://0.0.0.0:18081",
        "--advertise-schema-registry-addr",
        "internal://redpanda-test:8081,external://localhost:8082"
      ]
    ports:
      - "127.0.0.1:9093:19092" # kafka external (different from dev)
      - "127.0.0.1:8082:18081" # schema registry external (different from dev)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 10
