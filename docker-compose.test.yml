# Test infrastructure for integration and e2e tests.
# Run: docker compose -f docker-compose.test.yml up -d

services:
  redis-test:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: rising_intelligence_test
    volumes:
      - ./packages/db/prisma/migrations/20260205000000_initial_schema/migration.sql:/docker-entrypoint-initdb.d/0001_initial_schema.sql:ro
      - ./packages/db/prisma/migrations/20260205000001_add_consumer_lag_retention_policy/migration.sql:/docker-entrypoint-initdb.d/0002_consumer_lag_policy.sql:ro
      - ./packages/db/prisma/migrations/20260205000002_add_raw_events_search_vector/migration.sql:/docker-entrypoint-initdb.d/0003_raw_events_search.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d rising_intelligence_test"]
      interval: 5s
      timeout: 2s
      retries: 5
    # No persistent volume - tests start fresh

  # Redpanda for e2e tests only (heavier, slower startup)
  redpanda-test:
    profiles: ["e2e"]
    image: redpandadata/redpanda:${REDPANDA_VERSION:-v24.3.5}
    command:
      [
        "redpanda",
        "start",
        "--overprovisioned",
        "--smp",
        "1",
        "--memory",
        "512M",
        "--reserve-memory",
        "0M",
        "--node-id",
        "0",
        "--check=false",
        "--kafka-addr",
        "internal://0.0.0.0:9092,external://0.0.0.0:19092",
        "--advertise-kafka-addr",
        "internal://redpanda-test:9092,external://localhost:9093",
        "--schema-registry-addr",
        "internal://0.0.0.0:8081,external://0.0.0.0:18081",
        "--advertise-schema-registry-addr",
        "internal://redpanda-test:8081,external://localhost:8082"
      ]
    ports:
      - "127.0.0.1:9093:19092" # kafka external (different from dev)
      - "127.0.0.1:8082:18081" # schema registry external (different from dev)
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 2s
      retries: 10

  mock-llm-test:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: ./tests/e2e/mock-llm/Dockerfile
    environment:
      PORT: "8080"
      MOCK_LLM_RESPONSE_MODE: "success"
      MOCK_LLM_LATENCY_MS: "10"
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 10

  brief-test:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: ./apps/brief/Dockerfile
    depends_on:
      redpanda-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mock-llm-test:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "redpanda-test:9092"
      KAFKA_CLIENT_ID: "brief-e2e"
      KAFKA_CONSUMER_GROUP: "brief-e2e"
      KAFKA_TOPIC_SUMMARY_REQUESTS: "summary.requests"
      KAFKA_TOPIC_SUMMARY_RESULTS: "summary.results"
      DATABASE_URL: "postgresql://test:test@postgres-test:5432/rising_intelligence_test"
      REDIS_URL: "redis://redis-test:6379"
      LLM_PROVIDER: "http"
      LLM_ENDPOINT_URL: "http://mock-llm-test:8080/v1/generate"
      LLM_TIMEOUT_MS: "30000"
      LLM_DAILY_BUDGET_USD: "1.00"
      LOG_LEVEL: "info"
    ports:
      - "127.0.0.1:3006:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
